# Log4j2 Configuration for Console and Rolling File Logging
status = error
name = AthletiverseLogConfig
monitorInterval = 30

# Console appender for development (with color)
appender.console.type = Console
appender.console.name = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %style{%d{yyyy-MM-dd HH:mm:ss.SSS}}{cyan} [%highlight{%thread}{FATAL=bg_red, ERROR=red, WARN=yellow, INFO=green, DEBUG=blue, TRACE=magenta}] %highlight{%-5level}{FATAL=bg_red, ERROR=red, WARN=yellow, INFO=green, DEBUG=blue, TRACE=magenta} %style{%logger{36}}{cyan} - %msg%n%throwable

# Rolling file appender for all logs (plain, no color)
appender.rolling.type = RollingFile
appender.rolling.name = ROLLING
appender.rolling.fileName = logs/athletiverse.log
appender.rolling.filePattern = logs/athletiverse-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 30

# Root logger
rootLogger.level = info
rootLogger.appenderRefs = console, rolling
rootLogger.appenderRef.console.ref = CONSOLE
rootLogger.appenderRef.rolling.ref = ROLLING

# Application logger (DEBUG for your code, INFO for dependencies)
logger.app.name = com.SportNexus.Athletiverse
logger.app.level = debug
logger.app.additivity = false
logger.app.appenderRefs = console, rolling
logger.app.appenderRef.console.ref = CONSOLE
logger.app.appenderRef.rolling.ref = ROLLING

# Reduce noise from Spring and Hibernate
logger.springframework.name = org.springframework
logger.springframework.level = info

logger.hibernate.name = org.hibernate
logger.hibernate.level = warn

# End of file